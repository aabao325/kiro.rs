services:
  kiro-rs:
    # 宝塔/Compose 默认直接拉取本 fork 发布的 GHCR 多架构镜像
    image: ghcr.io/${IMAGE_OWNER:-aabao325}/kiro-rs:${IMAGE_TAG:-latest}
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "58990:8990"
    volumes:
      - ./config/:/app/config/
    restart: unless-stopped
